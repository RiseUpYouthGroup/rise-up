<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#173453">
  <meta name="description" content="Rise Up Youth Group at Resurrection Catholic Church">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>Rise Up Youth Group</title>
  <style>
    :root{
      --navy:#173453;
      --navy2:#234d78;
      --bg:#f5f7fa;
      --card:#ffffff;
      --text:#17202a;
      --muted:#667085;
      --border:#d9e0e8;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
      background:var(--bg);
      color:var(--text);
    }
    .app{max-width:680px;margin:0 auto;min-height:100vh;padding:20px 16px 42px}
    header{text-align:center;padding:8px 0 18px}
    .logo{width:190px;max-width:58vw;height:auto;display:block;margin:0 auto 8px}
    .church{font-size:14px;color:var(--muted);margin:0}
    .tagline{font-size:13px;color:var(--muted);margin:6px 0 0}
    .checkin{
      display:block;width:100%;border:0;border-radius:18px;padding:20px;
      background:var(--navy);color:white;font-size:21px;font-weight:800;
      text-decoration:none;text-align:center;box-shadow:0 8px 20px rgba(23,52,83,.16);
    }
    .checkin span{display:block;font-size:13px;font-weight:500;margin-top:5px;opacity:.9}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
    .card{
      min-height:132px;background:var(--card);border:1px solid var(--border);
      border-radius:18px;padding:16px;text-decoration:none;color:var(--text);
      display:flex;flex-direction:column;justify-content:flex-end;
    }
    button.card{width:100%;font:inherit;text-align:left;cursor:pointer}
    .icon{font-size:26px;line-height:1;margin-bottom:auto;color:var(--navy)}
    .title{font-size:16px;font-weight:750}
    .desc{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.35}
    .footer{text-align:center;color:var(--muted);font-size:11px;margin-top:28px}
    .modal{
      position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;
      align-items:flex-end;justify-content:center;padding:14px;z-index:20
    }
    .modal.open{display:flex}
    .sheet{
      width:min(650px,100%);background:white;border-radius:22px;padding:22px;
      box-shadow:0 -8px 40px rgba(0,0,0,.2)
    }
    .sheet h2{margin:0 0 8px;font-size:22px;color:var(--navy)}
    .sheet p{margin:0;color:var(--muted);line-height:1.5}
    .close{margin-top:18px;width:100%;padding:13px;border-radius:12px;border:1px solid var(--border);background:white;font-weight:700}
    @media(max-width:420px){
      .grid{grid-template-columns:1fr}
      .card{min-height:105px}
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <img src="rise-up-logo.png" alt="Rise Up Youth Group logo" class="logo">
      <p class="church">Resurrection Catholic Church</p>
      <p class="tagline">Faith · Friendship · Service</p>
    </header>

    <a class="checkin" href="https://forms.gle/G9z3biqdehQyaZwX8" target="_blank" rel="noopener">
      CHECK IN
      <span>I'm here for today's meeting</span>
    </a>

    <section class="grid" aria-label="Rise Up menu">
      <button class="card" data-title="Join Rise Up" data-text="New member registration will be connected here once the sign-up form is ready.">
        <div class="icon">＋</div><div class="title">Join Rise Up</div><div class="desc">Become part of our Youth Group</div>
      </button>
      <button class="card" data-title="Upcoming Events" data-text="Meetings, Youth Masses, dinners, service opportunities and other events will appear here.">
        <div class="icon">◷</div><div class="title">Upcoming Events</div><div class="desc">Meetings, Masses & activities</div>
      </button>
      <button class="card" data-title="Steubenville" data-text="Registration, payments, meetings, travel information and conference updates can be organized here.">
        <div class="icon">★</div><div class="title">Steubenville</div><div class="desc">Conference information & updates</div>
      </button>
      <button class="card" data-title="Fundraisers" data-text="Current fundraisers and volunteer opportunities can be listed here.">
        <div class="icon">◎</div><div class="title">Fundraisers</div><div class="desc">Campaigns & opportunities</div>
      </button>
      <button class="card" data-title="Donations" data-text="This section will link only to the official Resurrection Catholic Church donation system.">
        <div class="icon">♡</div><div class="title">Donations</div><div class="desc">Support Rise Up</div>
      </button>
      <button class="card" data-title="Contact Us" data-text="Rise Up ministry team contact information will be added here.">
        <div class="icon">✉</div><div class="title">Contact Us</div><div class="desc">Reach the ministry team</div>
      </button>
    </section>

    <div class="footer">RISE UP Youth Group · Resurrection Catholic Church</div>
  </main>

  <div id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="sheet">
      <h2 id="modal-title"></h2>
      <p id="modal-text"></p>
      <button class="close" id="close-modal">Close</button>
    </div>
  </div>

  <script>
    const modal=document.getElementById('modal');
    const title=document.getElementById('modal-title');
    const text=document.getElementById('modal-text');
    document.querySelectorAll('.card').forEach(btn=>{
      btn.addEventListener('click',()=>{
        title.textContent=btn.dataset.title;
        text.textContent=btn.dataset.text;
        modal.classList.add('open');
      });
    });
    document.getElementById('close-modal').addEventListener('click',()=>modal.classList.remove('open'));
    modal.addEventListener('click',e=>{if(e.target===modal) modal.classList.remove('open')});
    if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});}
  </script>
</body>
</html>
